server:
  port: 8084

spring:
  application:
    name: media-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: http://localhost:9000
  access-key: devpulse
  secret-key: devpulse123
  bucket-name: devpulse-media

management:
  distribution:
    percentiles-histogram:
      http:
        server:
          requests: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  server:
    port: 8084
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: ${spring.application.name}.log
  level:
    com.devpulse: DEBUG