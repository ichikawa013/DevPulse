server:
  port: 8084

spring:
  application:
    name: media-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: http://localhost:9000
  access-key: devpulse
  secret-key: devpulse123
  bucket-name: devpulse-media

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${spring.application.name}.log
  level:
    com.devpulse: DEBUG