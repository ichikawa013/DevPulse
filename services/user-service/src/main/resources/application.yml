server:
  port: 8081

spring:
  application:
    name: user-service

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/devpulse_users
    username: devpulse
    password: devpulse
    driver-class-name: org.postgresql.Driver


  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${spring.application.name}.log
  level:
    com.devpulse: DEBUG

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-time: ${JWT_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}