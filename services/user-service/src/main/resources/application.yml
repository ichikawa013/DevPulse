debug: true

server:
  port: 8081

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.graphql.security.GraphQlWebMvcSecurityAutoConfiguration
  application:
    name: user-service

  graphql:
    graphiql:
      enabled: true
    schema:
      inspection:
        enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/devpulse_users
    username: devpulse
    password: devpulse
    driver-class-name: org.postgresql.Driver


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${spring.application.name}.log
  level:
    com.devpulse: DEBUG
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-time: ${JWT_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}