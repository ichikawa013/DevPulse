apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: devpulse-api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              value: "local-test-secret-not-for-production"
            - name: USER_SERVICE_URI
              value: "http://user-service:8081"
            - name: FEED_SERVICE_URI
              value: "http://feed-service:8082"
            - name: MEDIA_SERVICE_URI
              value: "http://host.docker.internal:8084"
            - name: SPRING_DATA_REDIS_HOST
              value: "host.docker.internal"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"