apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: devpulse-user-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              value: "local-test-secret-not-for-production"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://host.docker.internal:5432/devpulse_users"
            - name: SPRING_DATASOURCE_USERNAME
              value: "devpulse"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "devpulse"
            - name: SPRING_DATA_REDIS_HOST
              value: "host.docker.internal"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"